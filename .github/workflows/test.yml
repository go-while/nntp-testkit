name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Linux and macOS only: proc and its tests send SIGTERM and SIGHUP
        # and read syscall.WaitStatus, which Windows does not have.
        os: [ubuntu-latest, macos-latest]
        # the minimum from go.mod, the previous release and the latest
        go: ['1.22.x', oldstable, stable]
        exclude:
          # current macOS refuses Go 1.22's test binaries at load: "dyld:
          # missing LC_UUID load command"; newer Go writes the load command
          - os: macos-latest
            go: '1.22.x'
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}, Go ${{ matrix.go }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false # standard library only: no go.sum to key a cache on
      - run: go version
      - run: go vet ./...
      - run: go test -race ./...
      - name: gofmt
        if: runner.os == 'Linux' && matrix.go == 'stable'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
